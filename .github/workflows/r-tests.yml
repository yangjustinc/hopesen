name: R synthetic tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install test framework
        shell: Rscript {0}
        run: install.packages("testthat", repos = "https://cloud.r-project.org")

      - name: Run data-free synthetic tests
        shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", reporter = "summary")
